version: '3.8'

services:
  frontend:
    container_name: cq-frontend
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: dev
    ports:
      - "3001:3000"
    environment:
      - BACKEND_URL=http://cq-backend:8000
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      fastapi:
        condition: service_healthy
    restart: always

  fastapi:
    container_name: cq-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - mongo
      - neo4j
      - redis
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai_worker:
    container_name: cq-ai-worker
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "app/workers/ai_worker.py"]
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    depends_on:
      - redis
      - mongo
      - neo4j
    restart: always

  redis:
    container_name: cq-redis
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    restart: always

  mongo:
    container_name: cq-mongo
    image: mongo:6.0
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  neo4j:
    container_name: cq-neo4j
    image: neo4j:5.12
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    restart: always

  langfuse:
    container_name: cq-langfuse
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=mysecret
      - NEXTAUTH_URL=http://localhost:3000
      - LANGFUSE_INIT_PROJECT_NAME=ClarityQuest
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=pk-lf-123
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=sk-lf-123
      - SALT=my_super_secret_salt_for_langfuse
      - ENCRYPTION_KEY=my_super_secret_encryption_key_32_chars_long_1234
    depends_on:
      - langfuse-db
    restart: always

  langfuse-db:
    container_name: cq-langfuse-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    restart: always

volumes:
  mongo_data:
  neo4j_data:
  langfuse_data:
